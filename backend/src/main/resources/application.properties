# ==========================================================================
# GAMEZONE BACKEND CONFIGURATION
# ==========================================================================

server.port=8080
server.servlet.context-path=/

# CORS Configuration
gamezone.cors.allowed-origins=http://localhost:8080,http://127.0.0.1:8080,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000

# JPA & Database Default Configuration (H2 in MySQL Compatibility Mode for instant zero-config launch)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:gamezone_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Initial Data Seeding
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# H2 Console (for debugging if enabled)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security Session Configuration
server.servlet.session.cookie.name=GAMEZONE_JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=12h
