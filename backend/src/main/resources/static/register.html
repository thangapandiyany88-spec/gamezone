<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — GameZone</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="index.html" class="logo-container">
      <i class="fa-solid fa-gamepad logo-icon"></i>
      <span>GAMEZONE</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a></li>
      <li><a href="games.html" class="nav-link"><i class="fa-solid fa-chess-board"></i> Games</a></li>
      <li><a href="login.html" class="btn btn-outline"><i class="fa-solid fa-right-to-bracket"></i> Login</a></li>
    </ul>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">CREATE ACCOUNT</h1>
        <p class="auth-subtitle">Join GameZone to compete on global leaderboards</p>
      </div>

      <div id="alertContainer"></div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="fullName" class="form-label">Full Name</label>
          <div class="input-wrapper">
            <input type="text" id="fullName" class="form-control" placeholder="Alex Gamer" required>
            <i class="fa-solid fa-user input-icon"></i>
          </div>
          <span class="error-text" id="fullNameError"></span>
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <div class="input-wrapper">
            <input type="email" id="email" class="form-control" placeholder="player@example.com" required>
            <i class="fa-solid fa-envelope input-icon"></i>
          </div>
          <span class="error-text" id="emailError"></span>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" class="form-control" placeholder="Minimum 6 characters" required>
            <i class="fa-solid fa-lock input-icon"></i>
          </div>
          <span class="error-text" id="passwordError"></span>
        </div>

        <div class="form-group">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <div class="input-wrapper">
            <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required>
            <i class="fa-solid fa-shield-halved input-icon"></i>
          </div>
          <span class="error-text" id="confirmPasswordError"></span>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" id="submitBtn">
          <i class="fa-solid fa-user-plus"></i> Register Player
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign In</a>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-content">
      <p>&copy; 2026 GameZone Hub. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
